name: Application Delivery Pipeline

# Prevent old pipelines from overwriting newer GitOps changes
concurrency:
  group: petclinic-delivery
  cancel-in-progress: true

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: skowronf/petclinic
  LOCAL_IMAGE: petclinic:${{ github.sha }}
  IMAGE_TAG: ${{ github.sha }}


jobs:

# ==========================================================
# STAGE 1
#
# CI responsibility:
# - validate source code
# - build application
# - build container image
# - security scan
# - publish immutable image
# ==========================================================

  build-and-push:

    name: Build Test Scan Push

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write


    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven


      # Fail early if application tests are broken
      - name: Run tests
        run: mvn test


      # Build application artifact
      - name: Build application
        run: mvn package -DskipTests


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Build image locally.
      # Image stays local until security checks pass.
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # Security gate.
      # Pipeline stops before publishing vulnerable images.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL
          exit-code: 1


      # Generate Software Bill of Materials
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.LOCAL_IMAGE }}


      # Authenticate only for push events
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Push exactly the scanned image.
      # No rebuild after security checks.
      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag \
            ${{ env.LOCAL_IMAGE }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}



# ==========================================================
# STAGE 2
#
# GitOps responsibility:
# update desired state only.
#
# ArgoCD watches this repository and deploys changes.
# ==========================================================

  update-gitops:

    name: Update GitOps Repository

    needs:
      - build-and-push

    if: github.event_name == 'push'

    runs-on: ubuntu-latest


    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: skowronf/enterprise-platform
          token: ${{ secrets.GITOPS_TOKEN }}


      - name: Install yq
        run: |
          sudo snap install yq


      # Update only desired image version.
      # Kubernetes manifests remain controlled by Git.
      - name: Update image tag
        run: |
          yq -i \
          '.image.tag="${{ github.sha }}"' \
          charts/petclinic-platform/charts/petclinic/values.yaml


      - name: Commit GitOps change
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet && exit 0

          git commit \
          -m "Update petclinic image ${{ github.sha }} [skip ci]"

          git push