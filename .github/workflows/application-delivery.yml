name: Application Delivery Pipeline v1


# Prevent old pipelines from overwriting newer GitOps changes
concurrency:
  group: petclinic-delivery
  cancel-in-progress: true



on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main



env:

  REGISTRY: ghcr.io

  IMAGE_NAME: skowronf/petclinic



jobs:


# ==========================================================
# STAGE 1
#
# CI responsibility:
# - validate code
# - build artifact
# - build container
# - security scan
# - publish immutable image
# ==========================================================


  build-and-push:


    name: Build Test Scan Push


    runs-on: ubuntu-latest


    permissions:

      contents: read

      packages: write



    steps:


      - name: Checkout source code

        uses: actions/checkout@v4



      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 17

          cache: maven



      # Fail early if application tests are broken

      - name: Run tests

        run: |

          mvn test



      # Create application artifact

      - name: Build application

        run: |

          mvn package -DskipTests



      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3



      # Generate OCI metadata:
      # commit SHA, source repository, build information

      - name: Docker metadata

        id: meta

        uses: docker/metadata-action@v5

        with:

          images: |

            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |

            type=sha



      # Build locally first.
      # Image is NOT pushed yet.
      # Security scanning happens before registry upload.

      - name: Build container image

        uses: docker/build-push-action@v6

        with:

          context: .

          load: true

          tags:

            petclinic:${{ github.sha }}

          cache-from:

            type=gha

          cache-to:

            type=gha,mode=max



      # Security gate.
      # Pipeline stops if critical vulnerabilities exist.

      - name: Trivy image scan

        uses: aquasecurity/trivy-action@v0.30.0

        with:

          image-ref:

            petclinic:${{ github.sha }}

          severity:

            CRITICAL

          exit-code:

            1



      # Generate Software Bill of Materials.
      # Helps understand image dependencies.

      - name: Generate SBOM

        uses: anchore/sbom-action@v0


      # Only main branch publishes images.

      - name: Login to GHCR

        if: github.event_name == 'push'

        uses: docker/login-action@v3

        with:

          registry: ${{ env.REGISTRY }}

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      # Push only scanned images.

      - name: Push image

        if: github.event_name == 'push'

        uses: docker/build-push-action@v6

        with:

          context: .

          push: true

          tags:

            ${{ steps.meta.outputs.tags }}

          cache-from:

            type=gha

          cache-to:

            type=gha,mode=max





# ==========================================================
# STAGE 2
#
# GitOps responsibility:
# update desired state only.
#
# ArgoCD will perform deployment.
# ==========================================================


  update-gitops:


    name: Update GitOps Repository


    needs:

      - build-and-push


    if: github.event_name == 'push'


    runs-on: ubuntu-latest



    steps:


      - name: Checkout GitOps repository

        uses: actions/checkout@v4

        with:

          repository: skowronf/enterprise-platform

          token: ${{ secrets.GITOPS_TOKEN }}



      - name: Install yq

        run: |

          sudo snap install yq



      # Change only desired image version.

      - name: Update image tag

        run: |

          yq -i \
          '.image.tag="${{ github.sha }}"' \
          charts/petclinic-platform/charts/petclinic/values.yaml



      - name: Commit GitOps change

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com


          git add .


          git diff --cached --quiet && exit 0


          git commit \
          -m "Update petclinic image ${{ github.sha }}"


          git push
