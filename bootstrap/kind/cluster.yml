kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: petclinic-ci
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP

      - containerPort: 443
        hostPort: 443
        protocol: TCP

    extraMounts:
      - hostPath: /home/vboxuser/petclinic/backup
        containerPath: /host-backups