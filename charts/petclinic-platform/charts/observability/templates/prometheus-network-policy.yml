apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-prometheus-scrape
  namespace: petclinic

spec:
  podSelector:
    matchLabels:
      app: petclinic

  policyTypes:
  - Ingress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability

    ports:
    - protocol: TCP
      port: 8080

# Allow Prometheus running in the 'observability' namespace to scrape
# PetClinic metrics from the /actuator/prometheus endpoint on TCP port 8080.