apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: petclinic
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53 # CoreDNS listens on UDP port 53 for DNS queries
        - protocol: TCP
          port: 53 # CoreDNS listens on TCP port 53 for DNS queries

# Allow all Pods in the 'petclinic' namespace to send DNS queries
# (UDP/TCP port 53) to Pods in the 'kube-system' namespace (e.g. CoreDNS).