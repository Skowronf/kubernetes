apiVersion: networking.k8s.io/v1
kind: NetworkPolicy 
metadata:
  name: postgres-allow-petclinic
  namespace: petclinic
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: petclinic
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 5433