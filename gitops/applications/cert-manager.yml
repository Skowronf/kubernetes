apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cert-manager
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40" # Deploy cert-manager last to ensure that all workloads are running and can request TLS certificates.

spec:

  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.18.2

    helm:
        # Install cert-manager Custom Resource Definitions.
        # Required for creating resources like Certificate, Issuer and ClusterIssuer.
      values: |
        crds:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true