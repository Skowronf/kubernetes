apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cluster-issuer
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-20"

spec:

  project: default

  source:
    repoURL: https://github.com/Skowronf/enterprise-platform
    targetRevision: main
    path: bootstrap/cert-manager/cluster-issuer.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:

    automated:
      prune: true
      selfHeal: true