apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ingress-nginx
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:

  project: default

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.12.0

    helm:
      releaseName: ingress-nginx

      values: |
        controller:
          # In AWS we don't need one NGINX pod per node.
          kind: Deployment

          replicaCount: 2

          # ALB will be the external entry point.
          # NGINX remains an internal Kubernetes ingress layer.
          hostPort:
            enabled: false

          service:
            type: ClusterIP

          admissionWebhooks:
            enabled: true

            patch:
              enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
